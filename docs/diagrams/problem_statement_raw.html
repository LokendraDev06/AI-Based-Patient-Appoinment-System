<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; width: 960px; height: 420px; font-family: 'Inter', sans-serif; overflow: hidden; }
  </style>
</head>
<body>
  <svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">

    <!-- TRADITIONAL SYSTEM (RED LANE) -->
    <rect x="30" y="70" width="900" height="145" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" rx="12"/>

    <!-- Box 1 -->
    <rect x="50" y="115" width="135" height="75" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" rx="8"/>

    <text x="117" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Vague Symptoms</text>

    <text x="292" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#dc2626">Misleading Web Searches</text>

    <line x1="365" y1="152" x2="395" y2="152" stroke="#ef4444" stroke-width="2"/>

    <!-- Box 3 -->
    <rect x="400" y="115" width="150" height="75" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <text x="475" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Books Wrong Specialist</text>
    <text x="475" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">e.g. Ortho instead of Rheum</text>
    <text x="475" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#dc2626">Misses Red-Flag Signs</text>

    <line x1="550" y1="152" x2="580" y2="152" stroke="#ef4444" stroke-width="2"/>

    <!-- Box 4 -->
    <rect x="585" y="115" width="145" height="75" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <text x="657" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Consultation Void</text>
    <text x="657" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Doctor Has No Background</text>
    <text x="657" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#dc2626">15 Min Wasted on Basics</text>

    <line x1="730" y1="152" x2="760" y2="152" stroke="#ef4444" stroke-width="2"/>

    <!-- Box 5 -->
    <rect x="765" y="115" width="145" height="75" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/>
    <text x="837" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#991b1b">Negative Impact</text>
    <text x="837" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#991b1b">Delayed Treatment</text>
    <text x="837" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Wasted Money &amp; Time</text>

    <text x="50" y="263" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803d">✔ PROPOSED AI-BASED APPOINTMENT SYSTEM (Intelligent &amp; Direct)</text>

    <text x="117" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#15803d">Conversational NLP</text>

    <!-- Box 2 -->
    <rect x="220" y="280" width="145" height="85" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" rx="8"/>
    <text x="292" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Emergency Red-Flag Filter</text>
    <text x="292" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Life-Risk Triage Check</text>
    <text x="292" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#15803d">Instant ER/112 Routing</text>

    <!-- Box 3 -->
    <rect x="400" y="280" width="150" height="85" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" rx="8"/>
    <text x="475" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Smart Doctor Matching</text>
    <text x="475" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Similarity Score Engine</text>
    <text x="475" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#15803d">Maps to 12+ Specialties</text>

    <!-- Box 4 -->
    <rect x="585" y="280" width="145" height="85" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" rx="8"/>
    <text x="657" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Conflict-Free Booking</text>
    <text x="657" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Atomic Slot Locking</text>
    <text x="657" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#15803d">Instant Confirmation</text>

    <text x="837" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#166534">Optimal Clinical Care</text>
    <text x="837" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#166534">Pre-Consult Summary</text>
    <text x="837" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#15803d">Accurate &amp; Timely Treat</text>
