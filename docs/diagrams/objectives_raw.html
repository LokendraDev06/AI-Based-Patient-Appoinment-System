<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; width: 960px; height: 420px; font-family: 'Inter', sans-serif; overflow: hidden; }
  </style>
</head>
<body>
  <svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="960" height="420" fill="#ffffff"/>
    
    <text x="480" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
      System Objectives: The 5 Core Pillars
    </text>

    <!-- Central Hub -->
    <circle cx="480" cy="220" r="85" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="480" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1e40af">AI-BASED PATIENT</text>
    <text x="480" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1e40af">APPOINTMENT</text>
    <text x="480" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1e40af">SYSTEM</text>
    <text x="480" y="254" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#2563eb">(Core Objectives Hub)</text>

    <!-- Pillar 1: Conversational AI Triage -->
    <rect x="50" y="80" width="220" height="100" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" rx="10"/>
    <text x="70" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">1. Conversational AI Triage</text>
    <text x="70" y="130" font-family="Inter, sans-serif" font-size="11" fill="#475569">• 24/7 Multi-turn symptom intake</text>
    <text x="70" y="148" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Natural Language Processing (NLP)</text>
    <text x="70" y="166" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Empathetic clinical dialogue</text>
    <line x1="270" y1="130" x2="410" y2="190" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4"/>

    <!-- Pillar 2: Emergency Red-Flag Filter -->
    <rect x="690" y="80" width="220" height="100" fill="#fff1f2" stroke="#f43f5e" stroke-width="2" rx="10"/>
    <text x="710" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#9f1239">2. Emergency Red-Flag Filter</text>
    <text x="710" y="130" font-family="Inter, sans-serif" font-size="11" fill="#881337">• Instant acute symptom detection</text>
    <text x="710" y="148" font-family="Inter, sans-serif" font-size="11" fill="#881337">• Heart attack/stroke red flags</text>
    <text x="710" y="166" font-family="Inter, sans-serif" font-size="11" fill="#881337">• Immediate 112/108 ER routing</text>
    <line x1="690" y1="130" x2="550" y2="190" stroke="#fda4af" stroke-width="2" stroke-dasharray="4"/>

    <!-- Pillar 3: Smart Specialist Matching -->
    <rect x="50" y="270" width="220" height="100" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="10"/>
    <text x="70" y="300" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#14532d">3. Smart Specialist Matching</text>
    <text x="70" y="320" font-family="Inter, sans-serif" font-size="11" fill="#166534">• Jaccard &amp; token similarity score</text>
    <text x="70" y="338" font-family="Inter, sans-serif" font-size="11" fill="#166534">• 12+ Medical Specializations</text>
    <text x="70" y="356" font-family="Inter, sans-serif" font-size="11" fill="#166534">• Eliminates self-diagnosis errors</text>
    <line x1="270" y1="310" x2="410" y2="250" stroke="#86efac" stroke-width="2" stroke-dasharray="4"/>

    <!-- Pillar 4: Conflict-Free Slot Booking -->
    <rect x="690" y="270" width="220" height="100" fill="#faf5ff" stroke="#a855f7" stroke-width="2" rx="10"/>
    <text x="710" y="300" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#581c87">4. Conflict-Free Slot Booking</text>
    <text x="710" y="320" font-family="Inter, sans-serif" font-size="11" fill="#6b21a8">• Atomic real-time slot locking</text>
    <text x="710" y="338" font-family="Inter, sans-serif" font-size="11" fill="#6b21a8">• Zero double-booking anomalies</text>
    <text x="710" y="356" font-family="Inter, sans-serif" font-size="11" fill="#6b21a8">• Instant SMS/Web confirmation</text>
    <line x1="690" y1="310" x2="550" y2="250" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="4"/>

    <!-- Pillar 5: Doctor Clinical Summary (Bottom) -->
    <rect x="360" y="325" width="240" height="80" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="10"/>
    <text x="480" y="348" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#92400e">5. Doctor Clinical Brief</text>
    <text x="480" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#78350f">• Pre-consultation AI summary</text>
    <text x="480" y="386" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#78350f">• Saves 10-15 mins of initial triage</text>
    <line x1="480" y1="305" x2="480" y2="325" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4"/>
  </svg>
</body>
</html>
