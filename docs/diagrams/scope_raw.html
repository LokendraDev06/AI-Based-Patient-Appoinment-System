<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; width: 960px; height: 420px; font-family: 'Inter', sans-serif; overflow: hidden; }
  </style>
</head>
<body>
  <svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="960" height="420" fill="#ffffff"/>
    
    <text x="480" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
      System Scope &amp; Feasibility Framework
    </text>

    <!-- LEFT COLUMN: SCOPE BOUNDARIES -->
    <rect x="40" y="65" width="420" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
    <text x="60" y="95" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">PROJECT SCOPE BOUNDARIES</text>
    
    <!-- In Scope Box -->
    <rect x="55" y="115" width="390" height="145" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="8"/>
    <text x="70" y="140" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#15803d">✔ IN-SCOPE FUNCTIONALITY</text>
    <text x="70" y="165" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Conversational NLP symptom assessment &amp; history intake</text>
    <text x="70" y="185" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Automated matching across 12+ medical specialist categories</text>
    <text x="70" y="205" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Conflict-free slot booking with instant confirmation</text>
    <text x="70" y="225" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Patient &amp; Doctor dual dashboards with clinical briefs</text>
    <text x="70" y="245" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Multi-provider auth (Google 1-Click OAuth + SMS OTP + JWT)</text>

    <!-- Out Scope Box -->
    <rect x="55" y="275" width="390" height="105" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="8"/>
    <text x="70" y="300" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">✖ OUT-OF-SCOPE LIMITATIONS</text>
    <text x="70" y="325" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Direct drug/medication prescriptions (requires doctor)</text>
    <text x="70" y="345" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Invasive robotic diagnostics or remote tele-surgery</text>
    <text x="70" y="365" font-family="Inter, sans-serif" font-size="11" fill="#1e293b">• Definitive pathological disease diagnosis without physical exam</text>

    <!-- RIGHT COLUMN: FEASIBILITY PILLARS -->
    <rect x="490" y="65" width="430" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
    <text x="510" y="95" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">FEASIBILITY ANALYSIS PILLARS</text>

    <!-- Technical Feasibility -->
    <rect x="505" y="115" width="400" height="75" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <text x="520" y="138" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">⚡ TECHNICAL FEASIBILITY: HIGH</text>
    <text x="520" y="158" font-family="Inter, sans-serif" font-size="11" fill="#475569">• React 18 frontend + Python FastAPI async backend</text>
    <text x="520" y="174" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Sub-second response times (&lt;1.5s chat, &lt;300ms booking)</text>

    <!-- Operational Feasibility -->
    <rect x="505" y="200" width="400" height="75" fill="#ffffff" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="520" y="223" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#047857">👥 OPERATIONAL FEASIBILITY: EXCELLENT</text>
    <text x="520" y="243" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Minimal learning curve for patients (conversational UI)</text>
    <text x="520" y="259" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Streamlined queue and schedule visibility for clinics</text>

    <!-- Economic Feasibility -->
    <rect x="505" y="285" width="400" height="75" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="520" y="308" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#b45309">💰 ECONOMIC FEASIBILITY: COST-EFFECTIVE</text>
    <text x="520" y="328" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Built on open-source stack (zero licensing fees)</text>
    <text x="520" y="344" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Reduces no-shows and unnecessary consultation transfers</text>
  </svg>
</body>
</html>
